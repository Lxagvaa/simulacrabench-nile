[project]
name = "simulacrabench-nile"
version = "0.15.0"
description = "SimulacraBench (NeurIPS 2026): survey response prediction with a gate-aware ensemble"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
gpu = ["tabpfn==9.1.0"]   # TabPFN and the torch models; preinstalled on the hosted image
dev = ["ruff"]

[tool.uv]
package = false
